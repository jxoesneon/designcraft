[package]
name = "designcraft"
description = "DesignCraft desktop app — sovereign Martensite runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "designcraft"

[lints]
workspace = true

[dependencies]
designcraft-engine = { workspace = true }
designcraft-ui-martensite = { workspace = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Icon + VERSIONINFO for designcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/designcraft", dest = "/usr/bin/designcraft", mode = "755" }
]
